<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto — YashStudio 2D</title>
  <meta name="description" content="Mini studio YashScript 2D no navegador. O projeto salva automaticamente a cada 5 minutos.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238affc1'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='38' font-weight='bold' text-anchor='middle' fill='%2304121f'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/auth.css">
  <style>
    :root { --bg:#0b0f1a; --panel:#111726; --panel2:#0e1420; --panel3:#0f1524; --line:#243149; --line2:#2c3d5c; --text:#e7edfb; --muted:#8ea2c7; --accent:#8affc1; --accent-ink:#04121f; --accent2:#7aa2ff; --sel:rgba(122,162,255,.22); --ok:#34d399; --danger:#f87171; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
    a { color:var(--accent2); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; }
    button:hover { border-color:var(--accent2); }
    button:disabled { opacity:.5; cursor:default; }
    input { font:inherit; }

    .app { height:100%; display:flex; flex-direction:column; }

    .menubar { display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--panel2); border-bottom:1px solid var(--line); flex:none; }
    .applogo { width:26px; height:26px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:900; font-size:15px; flex:none; }
    .brandname { font-weight:800; margin-right:6px; }
    .menus { display:flex; gap:2px; }
    .menu { position:relative; }
    .menu > button { padding:4px 9px; border-radius:7px; background:transparent; border:none; color:var(--text); font-size:12.5px; }
    .menu > button:hover, .menu.open > button { background:var(--panel3); }
    .menu-pop { position:absolute; top:calc(100% + 4px); left:0; z-index:60; min-width:200px; background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:5px; box-shadow:0 14px 34px rgba(0,0,0,.5); }
    .menu-pop button { display:flex; align-items:center; width:100%; text-align:left; padding:6px 10px; background:transparent; border:none; border-radius:6px; color:var(--text); font-size:12.5px; }
    .menu-pop button:hover { background:var(--accent2); color:var(--accent-ink); }
    .menu-pop .mi-atalho { margin-left:auto; color:var(--muted); font-size:11px; }
    .menu-pop button:hover .mi-atalho { color:var(--accent-ink); }
    .menu-pop .sep { height:1px; margin:4px 3px; background:var(--line2); }
    .mbspacer { flex:1; }
    .pname { background:var(--panel3); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 9px; font:600 12.5px system-ui; min-width:130px; max-width:240px; }
    .status { font-size:11.5px; color:var(--muted); }
    .status.ok { color:var(--ok); }
    .status.erro { color:var(--danger); }
    .tbtn { padding:5px 11px; font-size:12px; }
    .mblink { font-size:12px; color:var(--muted); }
    .menubar #ys-conta { display:flex; align-items:center; }

    .runbar { display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; flex:none; }
    .seg { display:flex; gap:2px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:2px; }
    .seg > button { padding:3px 12px; font-size:12px; border:none; background:transparent; color:var(--muted); border-radius:7px; }
    .seg > button:hover { color:var(--text); }
    .seg > button.on { background:var(--accent); color:var(--accent-ink); font-weight:700; }
    .rb-spacer { flex:1; }
    .rb-label { font-weight:700; font-size:12.5px; color:var(--accent); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 12px; }
    .playbtns { display:flex; align-items:center; gap:6px; }
    .pbtn { width:36px; height:29px; display:grid; place-items:center; font-size:13px; padding:0; }
    .pbtn.play { color:var(--accent); border-color:var(--accent); }
    .hud { margin-left:6px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }

    .docks { flex:1; min-height:0; display:grid; grid-template-columns:240px minmax(0,1fr) 292px; grid-template-rows:minmax(0,1fr) auto; gap:6px; padding:6px; }
    .zone[data-zona="esq"] { grid-column:1; grid-row:1 / 3; }
    .zone[data-zona="centro"] { grid-column:2; grid-row:1; }
    .zone[data-zona="dir"] { grid-column:3; grid-row:1 / 3; }
    .zone[data-zona="baixo"] { grid-column:2; grid-row:2; min-height:150px; max-height:230px; }

    .dock { display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; min-height:0; }
    .dock.dropalvo { outline:2px dashed var(--accent); outline-offset:-3px; }
    .dock-tabs { display:flex; align-items:center; gap:3px; background:var(--panel2); border-bottom:1px solid var(--line); padding:4px 5px; min-height:32px; flex:none; overflow-x:auto; overflow-y:hidden; }
    .dock-tabs:empty { display:none; }
    .tab { display:flex; align-items:center; gap:6px; padding:4px 11px; font-size:12px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--muted); white-space:nowrap; cursor:grab; }
    .tab:hover { background:var(--panel3); color:var(--text); }
    .tab.on { background:var(--panel); color:var(--text); border-color:var(--line); box-shadow:inset 0 2px 0 var(--accent); font-weight:600; }
    .tab:active { cursor:grabbing; }
    .tdot { width:9px; height:9px; border-radius:2px; flex:none; }
    .dock-body { position:relative; flex:1; min-height:0; overflow:hidden; }

    .panel { position:absolute; inset:0; padding:6px; overflow:auto; }
    .panel.vport { display:grid; place-items:center; padding:8px; overflow:hidden; }
    .panel.scriptp { display:flex; padding:0; }
    .panel.saidap { display:flex; flex-direction:column; }

    #tela { width:100%; height:100%; object-fit:contain; background:#080b13; border:1px solid var(--line); border-radius:9px; }
    textarea { flex:1; width:100%; height:100%; resize:none; background:var(--panel2); color:var(--text); border:none; padding:11px; font:12.5px/1.55 ui-monospace,Consolas,"Cascadia Code",monospace; tab-size:2; }
    textarea:focus { outline:none; }

    .erro { display:none; margin-bottom:6px; padding:7px 9px; border:1px solid #a33; background:#2a1014; color:#ffb4b4; border-radius:8px; font:11.5px/1.45 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
    .log { flex:1; min-height:50px; font:11.5px/1.5 ui-monospace,Consolas,monospace; color:#bcd0f0; }
    .log .p { color:var(--accent); }

    ul.tree { list-style:none; margin:0; padding:0; font:12px/1.7 ui-monospace,Consolas,monospace; }
    ul.tree ul { list-style:none; margin:0; padding-left:14px; border-left:1px dashed var(--line); }
    ul.tree .n { display:flex; align-items:center; gap:6px; padding:1px 5px; border-radius:6px; cursor:default; }
    ul.tree .n.click { cursor:pointer; }
    ul.tree .n.click:hover { background:var(--panel3); }
    ul.tree .n.sel { background:var(--sel); }
    .dot { width:9px; height:9px; border-radius:2px; background:var(--muted); flex:none; }
    .dot.dir { background:var(--accent2); }
    .dot.obj { background:var(--accent); border-radius:50%; }
    .dot.script { background:#ffe08a; }
    .dot.asset { background:#c99bff; }
    .badge { margin-left:auto; color:var(--muted); font-size:10.5px; }

    .tree-tools { display:flex; flex-wrap:wrap; gap:4px; padding:4px 6px; border-bottom:1px solid var(--line); }
    .tree-tools button { padding:3px 7px; font-size:11px; border-radius:6px; }
    .tree-tools button:disabled { opacity:.45; }

    ul.keys { margin:0; padding:0; list-style:none; font-size:12px; color:var(--muted); }
    ul.keys li { display:flex; gap:8px; padding:2px 0; }
    kbd { background:var(--panel3); border:1px solid var(--line2); border-bottom-width:2px; border-radius:6px; padding:1px 6px; font:11.5px ui-monospace,Consolas,monospace; color:var(--text); }

    .insp-head { display:flex; align-items:center; gap:6px; font-weight:700; margin:2px 2px 8px; }
    .insp-row { display:grid; grid-template-columns:86px 1fr; align-items:center; gap:6px; padding:2px; }
    .insp-label { color:var(--muted); font-size:11.5px; }
    .insp-row input, .insp-row select { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--text); padding:3px 7px; font-size:12px; }
    .insp-row input[type=checkbox] { width:auto; }
    .insp-ro { color:var(--text); font-size:12px; }
    .insp-swatch { width:20px; height:20px; border-radius:5px; border:1px solid var(--line2); }
    .insp-vazio { color:var(--muted); font-size:12px; padding:8px 4px; }

    .statusbar { display:flex; align-items:center; gap:10px; padding:5px 12px; background:var(--panel2); border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); flex:none; }

    .about-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:80; }
    .about-card { background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:18px 20px; max-width:430px; box-shadow:0 14px 40px rgba(0,0,0,.5); }
    .about-card h3 { margin:0 0 8px; }
    .about-card p { color:var(--muted); margin:0 0 14px; }

    .centro { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:40px; color:var(--muted); }
    .centro h2 { color:var(--text); }

    @media (max-width: 1000px) {
      .docks { grid-template-columns:1fr; grid-template-rows:none; overflow:auto; }
      .zone[data-zona="esq"], .zone[data-zona="centro"], .zone[data-zona="dir"], .zone[data-zona="baixo"] { grid-column:1; grid-row:auto; min-height:180px; max-height:none; }
    }
  </style>
</head>
<body>

<div class="app" id="principal" hidden>
  <div class="menubar">
    <span class="applogo">Y</span>
    <span class="brandname">YashStudio</span>
    <nav class="menus" id="menus"></nav>
    <span class="mbspacer"></span>
    <input class="pname" id="pnome" type="text" maxlength="60" value="Projeto" title="Nome do projeto">
    <span class="status" id="status"></span>
    <button class="tbtn" id="salvar" type="button" title="Salvar (Ctrl+S)">Salvar</button>
    <span id="ys-conta"></span>
    <a class="mblink" href="playground.html">Projetos</a>
  </div>

  <div class="runbar">
    <span class="rb-label" id="modoLabel">YashScript</span>
    <span class="rb-spacer"></span>
    <div class="playbtns">
      <button class="pbtn play" id="rodar" type="button" title="Rodar (F5)">▶</button>
      <button class="pbtn" id="pausar" type="button" title="Pausar/Continuar">⏸</button>
      <button class="pbtn" id="restaurar" type="button" title="Restaurar">⟲</button>
      <button class="pbtn" id="parar" type="button" title="Parar a execução e voltar para a cena">⏹</button>
      <span class="hud" id="hud">— fps</span>
    </div>
  </div>

  <div class="docks" id="docks">
    <section class="dock zone" data-zona="esq">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel" data-panel="arvorecenas" data-titulo="Nós" data-dot="dir"><div class="tree-tools" id="treeTools"></div><ul class="tree" id="tree"></ul></div>
        <div class="panel" data-panel="arquivos" data-titulo="Arquivos" data-dot="asset"><ul class="tree" id="treeArq"></ul></div>
      </div>
    </section>
    <section class="dock zone" data-zona="centro">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel vport" data-panel="cena" data-titulo="Cena" data-dot="obj"><canvas id="tela" width="900" height="520"></canvas></div>
        <div class="panel scriptp" data-panel="script" data-titulo="jogo.yash" data-dot="script"><textarea id="codigo" spellcheck="false"></textarea></div>
      </div>
    </section>
    <section class="dock zone" data-zona="dir">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel" data-panel="inspetor" data-titulo="Inspetor" data-dot="dir"><div id="inspector"></div></div>
      </div>
    </section>
    <section class="dock zone" data-zona="baixo">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel saidap" data-panel="saida" data-titulo="Saída" data-dot="asset"><div class="erro" id="erro"></div><div class="log" id="log"></div></div>
      </div>
    </section>
  </div>

  <div class="statusbar"><span id="note"></span></div>
</div>

<div class="centro" id="centro">
  <h2 id="centro-t">Carregando projeto…</h2>
  <p id="centro-p"></p>
</div>

  <script src="assets/engine.js"></script>
  <script src="assets/yash/lexer.js"></script>
  <script src="assets/yash/parser.js"></script>
  <script src="assets/yash/vm.js"></script>
  <script src="assets/yash/index.js"></script>
  <script src="assets/yash/yash-engine-host.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/auth.js"></script>
<script>
(function () {
  var el = function (tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { var v = attrs[k]; if (v == null) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v); }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  };

  var canvas = document.getElementById("tela");
  var hudEl = document.getElementById("hud");
  var errEl = document.getElementById("erro");
  var logEl = document.getElementById("log");
  var codeEl = document.getElementById("codigo");
  var treeEl = document.getElementById("tree");
  var treeToolsEl = document.getElementById("treeTools");
  var treeArqEl = document.getElementById("treeArq");
  var inspectorEl = document.getElementById("inspector");
  var noteEl = document.getElementById("note");
  var statusEl = document.getElementById("status");
  var pnomeEl = document.getElementById("pnome");
  var principal = document.getElementById("principal");
  var centro = document.getElementById("centro");
  var menusEl = document.getElementById("menus");
  var docksEl = document.getElementById("docks");
  var modoLabelEl = document.getElementById("modoLabel");

  var engine = null, modo = "yashnativo";
  var emExecucao = false;
  var raf = 0, lastT = 0, acc = 0, frames = 0;
  var mouseX = 0, mouseY = 0;
  var selectedId = null, inspFields = null, inspRenderId = "__none__";
  var arrasto = null;

  var paineis = {}, zonas = {}, arrastando = null;

  var projetoId = null, projetoNome = "Projeto";
  var dirty = false, salvando = false;

  var CONTEUDO_PADRAO = [
    "criar bloco 'chao'",
    "    posicao = (0, 300)",
    "    tamanho = (900, 40)",
    "    cor = rgb(60, 90, 70)",
    "    estatico = verdadeiro",
    "fim",
    "",
    "criar esfera 'bola'",
    "    posicao = (200, 60)",
    "    tamanho = (36, 36)",
    "    cor = rgb(255, 120, 90)",
    "    gravidade = verdadeiro",
    "    restituicao = 0.6",
    "fim",
    "",
    "quando iniciar",
    "    mostrar 'Ola! Aperte espaco para impulsionar a bola.'",
    "    seguir bola 0.2",
    "fim",
    "",
    "quando apertar_tecla 'space'",
    "    bola:impulso(140, -260)",
    "fim",
  ].join("\n") + "\n";

  var scripts = [{ nome: "jogo.yash", ativo: true, conteudo: "" }];

  var MUNDO_PADRAO = { largura: 900, altura: 520, fundo: "#0b0f1a", gravidade: 1400 };
  var CAMPOS_NO = ["nome", "tipo", "x", "y", "w", "h", "cor", "rot", "z", "vx", "vy", "alpha", "estatico", "gravidade", "restituicao", "friccao", "espaco", "texto", "visivel", "semColisao", "imagem", "tag"];
  var cena = cenaNova();

  function cenaNova() {
    return { largura: MUNDO_PADRAO.largura, altura: MUNDO_PADRAO.altura, fundo: MUNDO_PADRAO.fundo, gravidade: MUNDO_PADRAO.gravidade, camera: null, objetos: [] };
  }
  function noNormal(n, i) {
    var o = {
      id: (n && n.id) || ("n" + (i + 1) + "_" + Math.random().toString(36).slice(2, 6)),
      nome: (n && n.nome) || ("no" + (i + 1)),
      tipo: (n && n.tipo) || "retangulo",
      x: 0, y: 0, w: 32, h: 32, cor: "#7aa2ff", rot: 0, z: 0, vx: 0, vy: 0, alpha: 1,
      estatico: false, gravidade: false, espaco: "mundo", visivel: true
    };
    if (n) CAMPOS_NO.forEach(function (k) { if (n[k] !== undefined && n[k] !== null) o[k] = n[k]; });
    o.deCena = true;
    return o;
  }
  function cenaDe(doc) {
    var c = cenaNova();
    if (!doc || typeof doc !== "object") return c;
    ["largura", "altura", "fundo", "gravidade"].forEach(function (k) { if (doc[k] != null) c[k] = doc[k]; });
    if (doc.camera) c.camera = doc.camera;
    c.objetos = (Array.isArray(doc.objetos) ? doc.objetos : []).map(noNormal);
    return c;
  }
  function cenaParaSalvar() {
    return {
      largura: cena.largura, altura: cena.altura, fundo: cena.fundo, gravidade: cena.gravidade,
      camera: cena.camera,
      objetos: cena.objetos.map(function (o) {
        var n = { id: o.id };
        CAMPOS_NO.forEach(function (k) { if (o[k] !== undefined) n[k] = o[k]; });
        return n;
      })
    };
  }

  function nomeLivre(base) {
    var existe = function (n) { return cena.objetos.some(function (o) { return o.nome === n; }); };
    if (!existe(base)) return base;
    var i = 2; while (existe(base + i)) i++;
    return base + i;
  }
  var NO_PADRAO = {
    retangulo: { base: "bloco", w: 120, h: 40, cor: "#3c5a46" },
    circulo: { base: "bola", w: 36, h: 36, cor: "#ff785a" },
    triangulo: { base: "seta", w: 40, h: 40, cor: "#7aa2ff" },
    texto: { base: "aviso", w: 160, h: 24, cor: "#e8ecf8", texto: "Texto" }
  };
  function exigirCena() { if (emExecucao) pararExecucao(); }
  function adicionarNo(tipo) {
    exigirCena();
    var d = NO_PADRAO[tipo] || NO_PADRAO.retangulo;
    var n = noNormal({
      nome: nomeLivre(d.base), tipo: tipo,
      x: Math.round(cena.largura / 2 - d.w / 2), y: Math.round(cena.altura / 2 - d.h / 2),
      w: d.w, h: d.h, cor: d.cor, texto: d.texto, gravidade: tipo === "circulo", restituicao: tipo === "circulo" ? 0.6 : 0
    }, cena.objetos.length);
    cena.objetos.push(n);
    selectedId = n.id;
    marcarDirty();
    renderArvore(); renderInspector(true); preview();
    return n;
  }
  function noDaCena(id) {
    return cena.objetos.filter(function (o) { return o.id === id; })[0] || null;
  }
  function removerNoSelecionado() {
    exigirCena();
    var n = noDaCena(selectedId);
    if (!n) return null;
    cena.objetos = cena.objetos.filter(function (o) { return o !== n; });
    if (selectedId === n.id) selectedId = null;
    marcarDirty();
    renderArvore(); renderInspector(true); preview();
    return n;
  }
  function duplicarNoSelecionado() {
    exigirCena();
    var n = noDaCena(selectedId);
    if (!n) return null;
    var copia = noNormal(n, cena.objetos.length);
    copia.id = "n" + (cena.objetos.length + 1) + "_" + Math.random().toString(36).slice(2, 6);
    copia.nome = nomeLivre(n.nome + "2");
    copia.x = (n.x || 0) + 20;
    copia.y = (n.y || 0) + 20;
    cena.objetos.push(copia);
    selectedId = copia.id;
    marcarDirty();
    renderArvore(); renderInspector(true); preview();
    return copia;
  }
  var ALCA = 8, GRADE = 40;
  function zoomAtual() { return (engine && engine.camera && engine.camera.zoom) || 1; }
  function paraTela(x, y) {
    var cam = (engine && engine.camera) || { x: canvas.width / 2, y: canvas.height / 2 };
    var z = zoomAtual();
    return { x: (x - cam.x) * z + canvas.width / 2, y: (y - cam.y) * z + canvas.height / 2 };
  }
  function paraMundo(px, py) {
    var cam = (engine && engine.camera) || { x: canvas.width / 2, y: canvas.height / 2 };
    var z = zoomAtual();
    return { x: (px - canvas.width / 2) / z + cam.x, y: (py - canvas.height / 2) / z + cam.y };

      b.appendChild(el("span", { class: "tdot dot " + p.dot }));
      b.appendChild(el("span", { class: "tt", text: p.titulo }));
      b.addEventListener("click", function () { ativarPainel(z.id, pid); });
      b.addEventListener("dragstart", function (e) { arrastando = pid; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", pid); } catch (_) {} });
      b.addEventListener("dragend", function () { arrastando = null; });
      z.tabsEl.appendChild(b);
    });
    z.paineis.forEach(function (pid) { paineis[pid].el.hidden = (z.ativo !== pid); });
    z.el.hidden = z.paineis.length === 0;
  }
  function renderTodas() { Object.keys(zonas).forEach(function (k) { renderZona(zonas[k]); }); }

  function iniciarDocks() {
    paineis = {}; zonas = {};
    Array.prototype.forEach.call(docksEl.querySelectorAll(".zone"), function (z) {
      var zona = { id: z.getAttribute("data-zona"), el: z, tabsEl: z.querySelector("[data-tabs]"), bodyEl: z.querySelector("[data-body]"), paineis: [], ativo: null };
      Array.prototype.forEach.call(zona.bodyEl.querySelectorAll(".panel"), function (p) {
        var pid = p.getAttribute("data-panel");
        paineis[pid] = { id: pid, titulo: p.getAttribute("data-titulo"), dot: p.getAttribute("data-dot"), el: p };
        zona.paineis.push(pid);
      });
      zonas[zona.id] = zona;
    });
    Object.keys(zonas).forEach(function (k) {
      var z = zonas[k];
      z.el.addEventListener("dragover", function (e) { if (!arrastando) return; e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (_) {} z.el.classList.add("dropalvo"); });
      z.el.addEventListener("dragleave", function (e) { if (z.el.contains(e.relatedTarget)) return; z.el.classList.remove("dropalvo"); });
      z.el.addEventListener("drop", function (e) { e.preventDefault(); z.el.classList.remove("dropalvo"); if (arrastando) moverPainel(arrastando, z.id); arrastando = null; });
    });
    Object.keys(zonas).forEach(function (k) { if (zonas[k].paineis.length) zonas[k].ativo = zonas[k].paineis[0]; });
    renderTodas();
  }

  function definirModo(m) {
    modo = m; parar();
    modoLabelEl.textContent = m === "js" ? "JavaScript" : "YashScript";
    noteEl.innerHTML = m === "js"
      ? "Modo <b>JavaScript</b>: a lógica usa a API <code>ys.*</code> do motor direto (para quem quer controle fino)."
      : "Modo <b>YashScript</b>: interpretado pelo motor nativo do navegador, <b>sem Fengari, sem Luau e sem Roblox</b>.";
    noteEl.innerHTML += " O estúdio <b>abre parado</b>, com a cena em <b>contorno</b>: clique num nó para selecionar, <b>arraste</b> para mover, use as <b>alças</b> para redimensionar, <b>setas</b> ajustam (segure <b>Shift</b> para saltar de 40 em 40) e <b>Delete</b> remove. <b>▶ Rodar</b> testa o jogo — dá para selecionar e arrastar <b>durante a execução</b> (o contorno fica verde; essas mudanças são só do teste, a cena autorada não muda). <b>⏹ Parar</b> volta para a edição.";
    mostrarErro(""); limparLog();
    renderArvore(); preview();
  }

  var MENUS = [
    { rot: "Arquivo", itens: [
      { rot: "Salvar", atalho: "Ctrl+S", fn: function () { salvar(); } },
      { rot: "Rodar", atalho: "F5", fn: function () { rodar(); } },
      { sep: true },
      { rot: "Voltar aos projetos", fn: function () { location.href = "playground.html"; } },
      { rot: "Sair da conta", fn: function () { YashAuth.sair(); } }
    ] },
    { rot: "Cena", itens: [
      { rot: "Adicionar bloco", fn: function () { adicionarNo("retangulo"); } },
      { rot: "Adicionar esfera", fn: function () { adicionarNo("circulo"); } },
      { rot: "Adicionar triângulo", fn: function () { adicionarNo("triangulo"); } },
      { rot: "Adicionar texto", fn: function () { adicionarNo("texto"); } },
      { rot: "Remover nó selecionado", fn: function () { removerNoSelecionado(); } },
      { sep: true },
      { rot: "Rodar", fn: function () { rodar(); } },
      { rot: "Pausar / Continuar", fn: function () { pausarAcao(); } },
      { rot: "Parar", fn: function () { pararExecucao(); } },
      { rot: "Restaurar", fn: function () { restaurarAcao(); } }
    ] },
    { rot: "Exibir", itens: [
      { rot: "Aba: Cena", fn: function () { abrirPainel("cena"); } },
      { rot: "Aba: jogo.yash", fn: function () { abrirPainel("script"); } },
      { rot: "Aba: Saída", fn: function () { abrirPainel("saida"); } },
      { rot: "Aba: Inspetor", fn: function () { abrirPainel("inspetor"); } }
    ] },
    { rot: "Nó", itens: [
      { rot: "Renomear", fn: function () { abrirPainel("inspetor"); focarCampoInspetor("nome"); } },
      { rot: "Duplicar", fn: function () { duplicarNoSelecionado(); } },
      { rot: "Remover", fn: function () { removerNoSelecionado(); } }
    ] },
    { rot: "Modo", itens: [
      { rot: "YashScript", fn: function () { definirModo("yashnativo"); } },
      { rot: "JavaScript (API do motor)", fn: function () { definirModo("js"); } }
    ] },
    { rot: "Ajuda", itens: [
      { rot: "Sobre o YashStudio", fn: function () { mostrarSobre(); } }
    ] }
  ];

  function fecharMenus() {
    Array.prototype.forEach.call(menusEl.children, function (w) { w.classList.remove("open"); var p = w.querySelector(".menu-pop"); if (p) p.hidden = true; });
  }
  function construirMenus() {
    menusEl.innerHTML = "";
    MENUS.forEach(function (m) {
      var wrap = el("div", { class: "menu" });
      var btn = el("button", { type: "button", text: m.rot });
      var pop = el("div", { class: "menu-pop" }); pop.hidden = true;
      m.itens.forEach(function (it) {
        if (it.sep) { pop.appendChild(el("div", { class: "sep" })); return; }
        var b = el("button", { type: "button" }, [el("span", { text: it.rot })]);
        if (it.atalho) b.appendChild(el("span", { class: "mi-atalho", text: it.atalho }));
        b.onclick = function (e) { e.stopPropagation(); fecharMenus(); it.fn(); };
        pop.appendChild(b);
      });
      btn.onclick = function (e) { e.stopPropagation(); var abrir = pop.hidden; fecharMenus(); if (abrir) { pop.hidden = false; wrap.classList.add("open"); } };
      wrap.appendChild(btn); wrap.appendChild(pop); menusEl.appendChild(wrap);
    });
  }

  function mostrarSobre() {
    var o = el("div", { class: "about-bg" });
    var c = el("div", { class: "about-card" }, [
      el("h3", { text: "YashStudio 2D" }),
      el("p", { text: "Mini studio no navegador. A disposição dos painéis segue o estilo do Godot: as abas podem ser arrastadas entre os painéis e você escolhe onde cada uma fica. O visual segue o tema do site YashScript. O YashScript é executado pelo interpretador nativo do navegador — sem Fengari, sem Luau e sem Roblox; a geração de Luau continua existindo só no porte do plugin Roblox." }),
      el("p", { text: "A cena é guardada junto com o código na sua conta: dê ⏹ Parar para ver e editar os nós (posição, tamanho, cor, gravidade…), use “+ nó” para criar novos e escreva o script em YashScript. Um criar do script com o mesmo nome de um nó da cena reusa aquele nó — a execução nunca muda a cena autorada." }),
      el("button", { class: "tbtn", type: "button", text: "Fechar", onclick: function () { o.remove(); } })
    ]);
    o.appendChild(c);
    o.addEventListener("click", function (e) { if (e.target === o) o.remove(); });
    document.body.appendChild(o);
  }

  document.getElementById("rodar").addEventListener("click", rodar);
  document.getElementById("salvar").addEventListener("click", salvar);
  document.getElementById("pausar").addEventListener("click", pausarAcao);
  document.getElementById("restaurar").addEventListener("click", restaurarAcao);
  document.getElementById("parar").addEventListener("click", pararExecucao);

  codeEl.addEventListener("input", function () {
    scripts[0].conteudo = codeEl.value;
    marcarDirty();
  });
  pnomeEl.addEventListener("change", function () {
    projetoNome = pnomeEl.value.trim() || "Projeto";
    pnomeEl.value = projetoNome;
    marcarDirty();
  });

  function coordsDoEvento(e) {
    var r = canvas.getBoundingClientRect();
    // sem layout (canvas oculto ou headless) não há como escalar: trata o pixel de tela como pixel do mundo
    if (!r.width || !r.height) return { x: e.clientX, y: e.clientY };
    var escala = Math.min(r.width / canvas.width, r.height / canvas.height);
    var w = canvas.width * escala, h = canvas.height * escala;
    var ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
    return { x: (e.clientX - ox) / escala, y: (e.clientY - oy) / escala };
  }

  function podeEditar() { return !!engine && !!projetoId; }

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || !podeEditar()) return;
    var p = coordsDoEvento(e), no = objSelecionado();
    var alca = no ? alcaSob(no, p.x, p.y) : null;
    if (!alca) {
      var atingido = noSob(p.x, p.y);
      if (atingido) { if (atingido.id !== selectedId) selecionar(atingido.id); arrasto = { no: atingido, modo: "mover", px: p.x, py: p.y, x0: atingido.x, y0: atingido.y, w0: atingido.w, h0: atingido.h, mudou: false }; }
      else { arrasto = null; selecionar(null); }
      e.preventDefault();
      return;
    }
    arrasto = { no: no, modo: "redim", alca: alca, px: p.x, py: p.y, x0: no.x, y0: no.y, w0: no.w, h0: no.h, mudou: false };
    e.preventDefault();
  });

  window.addEventListener("mousemove", function (e) {
    if (!arrasto || !podeEditar()) return;
    var p = coordsDoEvento(e), no = arrasto.no;
    var dx = p.x - arrasto.px, dy = p.y - arrasto.py;
    var passo = e.shiftKey ? GRADE : 1;
    function arred(v) { return Math.round(v / passo) * passo; }
    if (arrasto.modo === "mover") {
      no.x = arred(arrasto.x0 + dx / zoomAtual());
      no.y = arred(arrasto.y0 + dy / zoomAtual());
    } else {
      var a = LADOS[arrasto.alca] || {}, z = zoomAtual();
      var esq = arrasto.x0, topo = arrasto.y0, larg = arrasto.w0, alt = arrasto.h0;
      if (a.e) larg = arrasto.w0 + dx / z;
      if (a.o) { larg = arrasto.w0 - dx / z; esq = arrasto.x0 + dx / z; }
      if (a.s) alt = arrasto.h0 + dy / z;
      if (a.n) { alt = arrasto.h0 - dy / z; topo = arrasto.y0 + dy / z; }
      larg = Math.max(passo, arred(larg)); alt = Math.max(passo, arred(alt));
      if (a.o) esq = arrasto.x0 + arrasto.w0 - larg;
      if (a.n) topo = arrasto.y0 + arrasto.h0 - alt;
      no.x = arred(esq); no.y = arred(topo); no.w = larg; no.h = alt;
    }
    arrasto.mudou = true;
    preview(); renderInspector(false);
  });

  window.addEventListener("mouseup", function () {
    if (!arrasto) return;
    var mudou = arrasto.mudou;
    arrasto = null;
    if (!mudou || emExecucao) return;
    marcarDirty();
    setStatus("cena ajustada");
  });

  canvas.addEventListener("mousemove", function (e) {
    var p = coordsDoEvento(e);
    mouseX = p.x; mouseY = p.y;
    if (!podeEditar() || arrasto) return;
    var no = objSelecionado();
    var alca = no ? alcaSob(no, p.x, p.y) : null;
    canvas.style.cursor = alca ? (CURSORES[alca] || "move") : (noSob(p.x, p.y) ? "move" : "default");
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "F5") { e.preventDefault(); rodar(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); salvar(); return; }
    if (!podeEditar()) return;
    var alvo = e.target;
    if (alvo && alvo.tagName && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT")) return;
    var no = objSelecionado();
    if (!no) return;
    if (!emExecucao && (e.key === "Delete" || e.key === "Backspace")) { e.preventDefault(); removerNoSelecionado(); return; }
    var passo = e.shiftKey ? GRADE : 1, mexeu = false;
    if (e.key === "ArrowLeft") { no.x -= passo; mexeu = true; }
    else if (e.key === "ArrowRight") { no.x += passo; mexeu = true; }
    else if (e.key === "ArrowUp") { no.y -= passo; mexeu = true; }
    else if (e.key === "ArrowDown") { no.y += passo; mexeu = true; }
    if (!mexeu) return;
    e.preventDefault();
    if (emExecucao) { renderInspector(false); return; }
    marcarDirty(); preview(); renderInspector(false);
  });

  setInterval(function () { if (dirty) salvar(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (document.hidden && dirty) salvar(); });
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  function erroView(msg) {
    centro.hidden = false; principal.hidden = true;
    document.getElementById("centro-t").textContent = "Não foi possível abrir o projeto";
    document.getElementById("centro-p").innerHTML = "";
    document.getElementById("centro-p").appendChild(el("span", { text: msg }));
    document.getElementById("centro-p").appendChild(document.createElement("br"));
    document.getElementById("centro-p").appendChild(el("a", { href: "playground.html", text: "Voltar aos meus projetos" }));
  }

  function boot() {
    projetoId = new URLSearchParams(location.search).get("id");
    if (!projetoId) return erroView("Projeto não especificado na URL.");
    YashAuth.carregarProjeto(projetoId).then(function (p) {
      if (!p) return erroView("Projeto não encontrado, ou ele não pertence à sua conta.");
      projetoNome = p.nome || "Projeto";
      pnomeEl.value = projetoNome;
      codeEl.value = (p.codigo && p.codigo.trim()) ? p.codigo : CONTEUDO_PADRAO;
      scripts[0].conteudo = codeEl.value;
      cena = cenaDe(p.cena);
      centro.hidden = true; principal.hidden = false;
      setStatus("salvo", "ok");
      definirModo("yashnativo");
    }, function (e) { erroView(e && e.message || String(e)); });
  }

  iniciarDocks();
  construirMenus();
  renderInspector(true);
  YashUI.chip(document.getElementById("ys-conta"), { aoProjetos: function () { location.href = "playground.html"; } });
  YashAuth.aoPronto(function (st) {
    if (!st.usuario) { centro.hidden = false; principal.hidden = true; YashUI.exigirLogin({ permitirPular: false }).then(boot); }
    else boot();
  });

  window.__yashDebug = function () {    var sel = objSelecionado();
    return { modo: modo, projeto: projetoId, dirty: dirty, emExecucao: emExecucao,
      nos: cena.objetos.length, cena: cenaParaSalvar(),
      selecionado: sel ? { id: sel.id, nome: sel.nome, x: sel.x, y: sel.y, w: sel.w, h: sel.h, daCena: !!noDaCena(sel.id) } : null,
      objs: engine ? engine.objs.filter(function (o) { return !o._dead; }).length : 0 };
  };
})();
</script>
</body>
