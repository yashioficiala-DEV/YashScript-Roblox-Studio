<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus projetos — YashScript Playground</title>
  <meta name="description" content="Escolha ou crie um projeto YashScript. Cada projeto abre o mini studio 2D e salva na nuvem automaticamente.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238affc1'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='38' font-weight='bold' text-anchor='middle' fill='%2304121f'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/auth.css">
  <style>
    :root { --bg:#0b0f1a; --bg-elev:#141b2d; --bg-soft:#1a2338; --border:#263049; --text:#e7edfb; --muted:#8ea2c7; --accent:#8affc1; --accent2:#7aa2ff; }
    * { box-sizing: border-box; }
    html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    a { color:var(--accent2); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:1100px; margin:0 auto; padding:18px 20px 60px; }
    .top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:26px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
    .logo { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#04121f; display:grid; place-items:center; font-weight:900; }
    .tag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 8px; }
    .spacer { flex:1; }
    .loading { text-align:center; color:var(--muted); padding:60px 0; }
    .ys-btn-primary { background:var(--accent2); border-color:var(--accent2); color:#04121f; font-weight:700; }
    .ys-pcard-ico { color:var(--accent2); background:rgba(122,162,255,.14); }
    .ys-pcard:hover { border-color:var(--accent2); }
    .modal-field { display:block; padding:0; }
    .modal-field > span { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="brand"><span class="logo">Y</span>YashWebEngine</span>
      <span class="tag">playground</span>
      <span class="spacer"></span>
      <span id="ys-conta"></span>
      <a href="index.html">← site</a>
    </header>

    <main class="ys-hub" id="hub" hidden>
      <div class="ys-hub-head">
        <div>
          <h1 class="ys-hub-title">Meus projetos</h1>
          <p class="ys-hub-sub" id="hub-sub"></p>
        </div>
        <span class="ys-hub-status" id="hub-status"></span>
        <button class="ys-btn ys-btn-primary" id="novo" type="button">+ Criar projeto</button>
      </div>
      <div class="ys-grid" id="grid"></div>
      <div class="ys-empty" id="vazio" hidden>Você ainda não tem projetos. Clique em <b>Criar projeto</b> para começar.</div>
    </main>

    <div class="loading" id="loading">Carregando…</div>
  </div>

  <script src="assets/firebase-config.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      var el = function (tag, attrs, kids) {
        var n = document.createElement(tag);
        if (attrs) for (var k in attrs) { var v = attrs[k]; if (v == null) continue;
          if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
          else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
          else n.setAttribute(k, v); }
        (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
        return n;
      };
      var hub = document.getElementById("hub");
      var grid = document.getElementById("grid");
      var vazio = document.getElementById("vazio");
      var loading = document.getElementById("loading");
      var hubSub = document.getElementById("hub-sub");
      var hubStatus = document.getElementById("hub-status");

      function toast(msg, tipo) {
        var t = el("div", { class: "ys-toast " + (tipo || ""), text: msg });
        document.body.appendChild(t);
        setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
      }
      function fmt(ts) {
        if (!ts) return "—";
        try { return new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
        catch (e) { return ""; }
      }

      function abrirCriar() {
        if (document.querySelector(".ys-criar-modal")) return;
        var inp = el("input", { class: "ys-input", type: "text", maxlength: "60", placeholder: "Nome do projeto" });
        var err = el("div", { class: "ys-form-err" });
        var criar = el("button", { class: "ys-btn ys-btn-primary", type: "button", text: "Criar" });
        var cancelar = el("button", { class: "ys-btn", type: "button", text: "Cancelar" });
        var bg = el("div", { class: "ys-modal-bg ys-criar-modal" });
        function fechar() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
        cancelar.onclick = fechar;
        bg.addEventListener("click", function (e) { if (e.target === bg) fechar(); });
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") criar.onclick(); });
        criar.onclick = function () {
          var nome = (inp.value || "").trim();
          if (!nome) { err.textContent = "Dê um nome ao projeto."; return; }
          criar.disabled = true; err.textContent = "";
          YashAuth.criarProjeto(nome).then(function (p) { fechar(); location.href = "projeto.html?id=" + encodeURIComponent(p.id); }, function (e) { err.textContent = e.message; criar.disabled = false; });
        };
        bg.appendChild(el("div", { class: "ys-modal" }, [
          el("h2", { style: "margin:0 0 14px;font-size:18px", text: "Novo projeto" }),
          el("label", { class: "modal-field" }, [el("span", { text: "Nome" }), inp]),
          err,
          el("div", { class: "ys-modal-actions" }, [cancelar, criar])
        ]));
        document.body.appendChild(bg);
        inp.focus();
      }

      function excluir(p) {
        if (!confirm('Excluir "' + p.nome + '"? Isso não pode ser desfeito.')) return;
        YashAuth.excluirProjeto(p.id).then(carregar, function (e) { toast(e.message, "erro"); });
      }

      function render(lista) {
        grid.innerHTML = "";
        vazio.hidden = lista.length > 0;
        lista.forEach(function (p) {
          var card = el("div", { class: "ys-pcard", onclick: function () { location.href = "projeto.html?id=" + encodeURIComponent(p.id); } });
          card.appendChild(el("div", { class: "ys-pcard-ico", text: "{}" }));
          card.appendChild(el("div", { class: "ys-pcard-name", text: p.nome || "Projeto sem nome" }));
          card.appendChild(el("div", { class: "ys-pcard-meta", text: "editado em " + fmt(p.atualizadoEm) }));
          card.appendChild(el("div", { class: "ys-pcard-actions" }, [
            el("button", { class: "ys-pcard-del", type: "button", text: "excluir", onclick: function (e) { e.stopPropagation(); excluir(p); } })
          ]));
          grid.appendChild(card);
        });
      }

      function carregar() {
        var st = YashAuth.estado();
        if (!st.usuario) return;
        hub.hidden = false; loading.hidden = true;
        hubSub.textContent = "Conta: " + st.usuario.nome + (st.usuario.tipo === "temporario" ? " (temporária · " + YashAuth.diasRestantes() + " dias restantes)" : "");
        hubStatus.textContent = st.nuvem ? "salvo na nuvem" : "modo local";
        YashAuth.listarProjetos().then(render, function (e) { toast("Erro ao carregar: " + e.message, "erro"); });
      }

      function garantir(st) {
        if (st.usuario) { carregar(); }
        else { hub.hidden = true; YashUI.exigirLogin({ permitirPular: false }); }
      }

      document.getElementById("novo").addEventListener("click", abrirCriar);
      YashUI.chip(document.getElementById("ys-conta"), { aoProjetos: carregar });
      YashAuth.aoPronto(garantir);
      YashAuth.aoMudar(function (st) { if (!st.usuario) garantir(st); });
    })();
  </script>
</body>
</html>
