<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto — YashStudio 2D</title>
  <meta name="description" content="Mini studio YashScript 2D no navegador. O projeto salva automaticamente a cada 5 minutos.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238affc1'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='38' font-weight='bold' text-anchor='middle' fill='%2304121f'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/auth.css">
  <style>
    :root { --bg:#252b34; --panel:#363d4a; --panel2:#252b34; --panel3:#303641; --line:#20252e; --line2:#4a525f; --text:#cdcfd2; --muted:#90949b; --accent:#70bafa; --accent-ink:#10161c; --accent2:#5a8ac6; --sel:rgba(112,186,250,.28); --ok:#73f280; --danger:#ff786b; --sep:rgba(255,255,255,.08); --gplay:#73f280; --gwarn:#ffde66; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button { font:inherit; color:var(--text); background:var(--panel3); border:1px solid var(--line); border-radius:0; padding:4px 10px; cursor:pointer; }
    button:hover { border-color:var(--accent); background:#3a424f; }
    button:disabled { opacity:.5; cursor:default; }
    input { font:inherit; }

    .app { height:100%; display:flex; flex-direction:column; }

    .menubar { display:flex; align-items:center; gap:2px; height:30px; padding:0 6px; background:var(--panel2); border-bottom:1px solid var(--line); flex:none; }
    .applogo { width:20px; height:20px; border-radius:3px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:900; font-size:12px; flex:none; margin-right:4px; }
    .brandname { font-weight:700; margin-right:8px; font-size:12.5px; color:var(--text); }
    .menus { display:flex; gap:0; }
    .menu { position:relative; }
    .menu > button { padding:4px 9px; border-radius:0; background:transparent; border:none; color:var(--text); font-size:12.5px; }
    .menu > button:hover, .menu.open > button { background:var(--panel3); }
    .menu-pop { position:absolute; top:calc(100% + 1px); left:0; z-index:60; min-width:210px; background:#3f4756; border:1px solid var(--line2); border-radius:0; padding:3px; box-shadow:0 8px 22px rgba(0,0,0,.55); }
    .menu-pop button { display:flex; align-items:center; width:100%; text-align:left; padding:5px 10px; background:transparent; border:none; border-radius:0; color:var(--text); font-size:12.5px; }
    .menu-pop button:hover { background:var(--accent); color:var(--accent-ink); }
    .menu-pop .mi-atalho { margin-left:auto; padding-left:18px; color:var(--muted); font-size:11px; }
    .menu-pop button:hover .mi-atalho { color:var(--accent-ink); }
    .menu-pop .sep { height:1px; margin:3px 3px; background:var(--line); }
    .mbspacer { flex:1; }
    .ws-tabs { display:flex; align-items:center; gap:0; margin:0 6px; }
    .ws-tabs button { padding:3px 12px; font-size:12px; border:1px solid var(--line); border-left:none; background:var(--panel2); color:var(--muted); border-radius:0; }
    .ws-tabs button:first-child { border-left:1px solid var(--line); border-radius:3px 0 0 3px; }
    .ws-tabs button:last-child { border-radius:0 3px 3px 0; }
    .ws-tabs button.on { background:var(--accent); color:var(--accent-ink); font-weight:700; }
    .pname { background:var(--panel3); color:var(--text); border:1px solid var(--line); border-radius:0; padding:4px 8px; font:600 12px "Segoe UI",system-ui; min-width:120px; max-width:220px; }
    .status { font-size:11.5px; color:var(--muted); }
    .status.ok { color:var(--ok); }
    .status.erro { color:var(--danger); }
    .tbtn { padding:4px 10px; font-size:12px; }
    .mblink { font-size:12px; color:var(--muted); }
    .menubar #ys-conta { display:flex; align-items:center; }

    .runbar { display:flex; align-items:center; gap:8px; height:36px; padding:0 8px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:nowrap; flex:none; }
    .seg { display:flex; gap:0; background:var(--panel2); border:1px solid var(--line); border-radius:0; padding:0; }
    .seg > button { padding:4px 12px; font-size:12px; border:none; border-right:1px solid var(--line); background:transparent; color:var(--muted); border-radius:0; }
    .seg > button:last-child { border-right:none; }
    .seg > button:hover { color:var(--text); background:var(--panel3); }
    .seg > button.on { background:var(--accent); color:var(--accent-ink); font-weight:700; }
    .rb-spacer { flex:1; }
    .rb-label { font-weight:700; font-size:12.5px; color:var(--text); background:var(--panel2); border:1px solid var(--line); padding:4px 12px; }
    .playbtns { display:flex; align-items:center; gap:0; background:var(--panel2); border:1px solid var(--line); }
    .pbtn { width:34px; height:28px; display:grid; place-items:center; font-size:14px; padding:0; background:transparent; border:none; border-right:1px solid var(--line); border-radius:0; color:var(--text); }
    .pbtn:last-child { border-right:none; }
    .pbtn:hover { background:var(--panel3); }
    .pbtn.play { color:var(--gplay); }
    .pbtn.stop { color:var(--danger); }
    .hud { margin-left:8px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }

    .docks { flex:1; min-height:0; display:grid; grid-template-columns:250px minmax(0,1fr) 300px; grid-template-rows:minmax(0,1fr) auto; gap:1px; padding:0; background:var(--line); }
    .zone[data-zona="esq"] { grid-column:1; grid-row:1 / 3; }
    .zone[data-zona="centro"] { grid-column:2; grid-row:1; }
    .zone[data-zona="dir"] { grid-column:3; grid-row:1 / 3; }
    .zone[data-zona="baixo"] { grid-column:2; grid-row:2; min-height:150px; max-height:230px; }

    .dock { display:flex; flex-direction:column; background:var(--panel); border:none; border-radius:0; overflow:hidden; min-height:0; }
    .dock.dropalvo { outline:2px solid var(--accent); outline-offset:-2px; }
    .dock-tabs { display:flex; align-items:flex-end; gap:1px; background:var(--panel2); border-bottom:1px solid var(--line); padding:3px 4px 0; min-height:28px; flex:none; overflow-x:auto; overflow-y:hidden; }
    .dock-tabs:empty { display:none; }
    .tab { display:flex; align-items:center; gap:6px; padding:4px 11px; font-size:12px; border:1px solid transparent; border-bottom:none; border-radius:4px 4px 0 0; background:transparent; color:var(--muted); white-space:nowrap; cursor:grab; }
    .tab:hover { background:var(--panel3); color:var(--text); }
    .tab.on { background:var(--panel); color:var(--text); border-color:var(--line); border-bottom:1px solid var(--panel); margin-bottom:-1px; font-weight:600; }
    .tab:active { cursor:grabbing; }
    .tdot { width:9px; height:9px; border-radius:2px; flex:none; }
    .dock-body { position:relative; flex:1; min-height:0; overflow:hidden; }

    .panel { position:absolute; inset:0; padding:4px; overflow:auto; }
    .panel.vport { display:grid; place-items:center; padding:6px; overflow:hidden; background:var(--panel2); }
    .panel.scriptp { display:flex; padding:0; }
    .panel.saidap { display:flex; flex-direction:column; }

    #tela { width:100%; height:100%; object-fit:contain; background:#1d2229; border:1px solid var(--line); border-radius:0; }
    textarea { flex:1; width:100%; height:100%; resize:none; background:#1d2229; color:var(--text); border:none; padding:9px 11px; font:12.5px/1.5 "Cascadia Mono",ui-monospace,Consolas,monospace; tab-size:4; }
    textarea:focus { outline:none; }

    .erro { display:none; margin-bottom:5px; padding:6px 8px; border:1px solid #5a2a2a; background:#2a1416; color:#ffb4b4; border-radius:0; font:11.5px/1.45 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
    .log { flex:1; min-height:50px; font:11.5px/1.45 ui-monospace,Consolas,monospace; color:#bcd0f0; }
    .log .p { color:var(--accent); }

    ul.tree { list-style:none; margin:0; padding:0; font:12px/1.5 "Segoe UI",system-ui,sans-serif; }
    ul.tree ul { list-style:none; margin:0; padding-left:15px; border-left:1px solid var(--sep); }
    ul.tree .n { display:flex; align-items:center; gap:6px; padding:1px 5px; border-radius:0; cursor:default; }
    ul.tree .n.click { cursor:pointer; }
    ul.tree .n.click:hover { background:var(--panel3); }
    ul.tree .n.sel { background:var(--sel); color:#fff; }
    .dot { width:10px; height:10px; border-radius:0; background:var(--muted); flex:none; }
    .dot.dir { background:var(--accent2); }
    .dot.obj { background:#e0666c; border-radius:2px; }
    .dot.script { background:#8fd07a; border-radius:0; }
    .dot.asset { background:#c99bff; border-radius:0; }
    .badge { margin-left:auto; color:var(--muted); font-size:10.5px; }

    .tree-tools { display:flex; flex-wrap:wrap; gap:3px; padding:3px 5px; border-bottom:1px solid var(--line); }
    .tree-tools button { padding:2px 7px; font-size:11px; border-radius:0; }
    .tree-tools button:disabled { opacity:.45; }

    /* menu de contexto da engine (botão direito) */
    .ctx { position:fixed; z-index:120; min-width:210px; background:#3f4756; border:1px solid var(--line2); border-radius:0; padding:3px; box-shadow:0 10px 26px rgba(0,0,0,.55); }
    .ctx h4 { margin:2px 0 4px; padding:0 8px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .ctx button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:5px 10px; background:transparent; border:none; border-radius:0; color:var(--text); font-size:12.5px; }
    .ctx button:hover:not(:disabled) { background:var(--accent); color:var(--accent-ink); }
    .ctx button:disabled { opacity:.4; }
    .ctx .mi-atalho { margin-left:auto; color:var(--muted); font-size:11px; }
    .ctx button:hover .mi-atalho { color:var(--accent-ink); }
    .ctx .sep { height:1px; margin:3px 3px; background:var(--line); }

    /* diálogo simples (nomear, escolher nó) */
    .dlg-bg { position:fixed; inset:0; z-index:140; background:rgba(6,9,14,.6); display:grid; place-items:center; }
    .dlg { width:min(460px, 92vw); max-height:82vh; display:flex; flex-direction:column; gap:10px; background:var(--panel); border:1px solid var(--line2); border-radius:0; padding:14px 16px; box-shadow:0 18px 48px rgba(0,0,0,.6); }
    .dlg h3 { margin:0; font-size:15px; }
    .dlg p { margin:0; color:var(--muted); font-size:12px; }
    .dlg input { background:#1d2229; border:1px solid var(--line); border-radius:0; color:var(--text); padding:6px 9px; font:12.5px ui-monospace,Consolas,monospace; }
    .dlg input:focus { outline:none; border-color:var(--accent); }
    .dlg-err { color:#ffb4b4; font-size:11.5px; min-height:14px; }
    .dlg-actions { display:flex; justify-content:flex-end; gap:8px; }
    .dlg-lista { flex:1; min-height:180px; overflow:auto; border:1px solid var(--line); border-radius:0; background:#1d2229; }
    .dlg-lista h5 { margin:8px 10px 4px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .dlg-lista button { display:block; width:100%; text-align:left; padding:5px 10px; background:transparent; border:none; border-radius:0; color:var(--text); font-size:12.5px; cursor:pointer; }
    .dlg-lista button:hover, .dlg-lista button.on { background:var(--accent); color:var(--accent-ink); }
    .dlg-lista button:hover small, .dlg-lista button.on small { color:var(--accent-ink); }
    .dlg-lista button small { display:block; color:var(--muted); font-size:11px; }

    /* X para fechar aba */
    .tab-x { display:grid; place-items:center; width:16px; height:16px; margin-left:2px; padding:0; border:none; border-radius:2px; background:transparent; color:var(--muted); font-size:14px; line-height:1; cursor:pointer; }
    .tab-x:hover { background:#452830; color:#ff9c9c; }

    /* re-dock estilo Godot: áreas aceitas para soltar a aba */
    .zone { position:relative; }
    .dock.flutuante, .panel.flutuante { position:fixed; z-index:110; width:360px; height:320px; box-shadow:0 16px 44px rgba(0,0,0,.6); display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line2); border-radius:0; }
    .panel.flutuante > :not(.float-bar) { flex:1; min-height:0; overflow:auto; }
    .float-bar { display:flex; align-items:center; gap:8px; padding:4px 8px; background:var(--panel2); border-bottom:1px solid var(--line); font-size:12px; cursor:grab; flex:none; }
    .float-bar .tt { font-weight:600; }
    .float-bar button { margin-left:auto; padding:2px 8px; font-size:11px; border-radius:0; }
    .zona-alvo { position:absolute; inset:0; z-index:129; pointer-events:none; display:none; }
    .zona-alvo.on { display:block; }
    .band { position:absolute; background:rgba(112,186,250,.12); border:2px solid transparent; border-radius:0; }
    .band.on { background:rgba(112,186,250,.32); border-color:var(--accent); }
    body.arrastando-aba { cursor:grabbing; }

    /* soltar arquivos do PC */
    .drop-arq { position:fixed; inset:0; z-index:150; display:none; place-items:center; background:rgba(6,9,14,.72); }
    .drop-arq.on { display:grid; }
    .drop-arq div { border:2px dashed var(--accent); border-radius:0; padding:26px 34px; color:var(--text); font-size:15px; background:var(--panel); }
    .drop-arq small { display:block; margin-top:6px; color:var(--muted); font-size:11.5px; }

    /* tira de cenas (como os sub-abas de cena da Godot) */
    .scenes-strip { display:flex; flex-wrap:wrap; gap:2px; padding:3px 4px; border-bottom:1px solid var(--line); flex:none; }
    .chip-cena { display:flex; align-items:center; gap:5px; padding:2px 8px; background:var(--panel2); border:1px solid var(--line); border-radius:0; color:var(--muted); font-size:11.5px; cursor:pointer; }
    .chip-cena:hover { border-color:var(--line2); color:var(--text); }
    .chip-cena.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
    .chip-cena .cn { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chip-cena .cnt { font-size:10px; opacity:.7; }
    .chip-cena.mais { padding:2px 9px; font-size:14px; }
    .tree-hint { color:var(--muted); font-size:11px; font-style:italic; padding:2px 4px; }

    ul.keys { margin:0; padding:0; list-style:none; font-size:12px; color:var(--muted); }
    ul.keys li { display:flex; gap:8px; padding:2px 0; }
    kbd { background:var(--panel3); border:1px solid var(--line2); border-bottom-width:2px; border-radius:6px; padding:1px 6px; font:11.5px ui-monospace,Consolas,monospace; color:var(--text); }

    .insp-head { display:flex; align-items:center; gap:6px; font-weight:700; margin:2px 2px 8px; padding:3px 5px; background:var(--panel2); border:1px solid var(--line); }
    .insp-row { display:grid; grid-template-columns:100px 1fr; align-items:center; gap:6px; padding:2px 3px; border-bottom:1px solid var(--sep); }
    .insp-label { color:var(--muted); font-size:11.5px; }
    .insp-row input, .insp-row select { width:100%; background:#1d2229; border:1px solid var(--line); border-radius:0; color:var(--text); padding:3px 7px; font-size:12px; }
    .insp-row input:focus, .insp-row select:focus { outline:none; border-color:var(--accent); }
    .insp-row input[type=checkbox] { width:auto; }
    .insp-ro { color:var(--text); font-size:12px; }
    .insp-swatch { width:20px; height:20px; border-radius:0; border:1px solid var(--line2); }
    .insp-vazio { color:var(--muted); font-size:12px; padding:8px 4px; }

    .statusbar { display:flex; align-items:center; gap:10px; padding:4px 10px; background:var(--panel2); border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); flex:none; }

    .about-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:80; }
    .about-card { background:var(--panel); border:1px solid var(--line2); border-radius:0; padding:18px 20px; max-width:430px; box-shadow:0 14px 40px rgba(0,0,0,.5); }
    .about-card h3 { margin:0 0 8px; }
    .about-card p { color:var(--muted); margin:0 0 14px; }

    .centro { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:40px; color:var(--muted); }
    .centro h2 { color:var(--text); }

    @media (max-width: 1000px) {
      .docks { grid-template-columns:1fr; grid-template-rows:none; overflow:auto; }
      .zone[data-zona="esq"], .zone[data-zona="centro"], .zone[data-zona="dir"], .zone[data-zona="baixo"] { grid-column:1; grid-row:auto; min-height:180px; max-height:none; }
    }
  </style>
</head>
<body>

<div class="app" id="principal" hidden>
  <div class="menubar">
    <span class="applogo">Y</span>
    <span class="brandname">YashStudio</span>
    <nav class="menus" id="menus"></nav>
    <span class="mbspacer"></span>
    <div class="ws-tabs" id="wsTabs">
      <button type="button" id="ws2d" title="Editor 2D">2D</button>
      <button type="button" id="ws3d" title="Editor 3D">3D</button>
      <button type="button" id="wsScript" title="Editor de Script">Script</button>
    </div>
    <span class="mbspacer"></span>
    <span class="status" id="status"></span>
    <span id="ys-conta"></span>
    <a class="mblink" href="playground.html">Projetos</a>
  </div>

  <div class="runbar">
    <span class="rb-label" id="modoLabel">YashScript</span>
    <input class="pname" id="pnome" type="text" maxlength="60" value="Projeto" title="Nome do projeto">
    <button class="tbtn" id="salvar" type="button" title="Salvar (Ctrl+S)">Salvar</button>
    <span class="rb-spacer"></span>
    <div class="playbtns">
      <button class="pbtn play" id="rodar" type="button" title="Rodar o projeto (F5)">▶</button>
      <button class="pbtn play" id="pausar" type="button" title="Pausar / Continuar">⏸</button>
      <button class="pbtn" id="restaurar" type="button" title="Restaurar">⟲</button>
      <button class="pbtn stop" id="parar" type="button" title="Parar a execução e voltar para a cena">⏹</button>
    </div>
    <span class="hud" id="hud">— fps</span>
  </div>

  <div class="docks" id="docks">
    <section class="dock zone" data-zona="esq">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel" data-panel="arvorecenas" data-titulo="Cena" data-dot="dir"><div class="scenes-strip" id="scenes"></div><div class="tree-tools" id="treeTools"></div><ul class="tree" id="tree"></ul></div>
        <div class="panel" data-panel="arquivos" data-titulo="Sistema de Arquivos" data-dot="asset"><ul class="tree" id="treeArq"></ul></div>
      </div>
    </section>
    <section class="dock zone" data-zona="centro">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel vport" data-panel="cena" data-titulo="Cena" data-dot="obj"><canvas id="tela" width="900" height="520"></canvas></div>
        <div class="panel scriptp" data-panel="script" data-titulo="jogo.yash" data-dot="script"><textarea id="codigo" spellcheck="false"></textarea></div>
      </div>
    </section>
    <section class="dock zone" data-zona="dir">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel" data-panel="inspetor" data-titulo="Inspetor" data-dot="dir"><div id="inspector"></div></div>
      </div>
    </section>
    <section class="dock zone" data-zona="baixo">
      <div class="dock-tabs" data-tabs></div>
      <div class="dock-body" data-body>
        <div class="panel saidap" data-panel="saida" data-titulo="Saída" data-dot="asset"><div class="erro" id="erro"></div><div class="log" id="log"></div></div>
      </div>
    </section>
  </div>

  <div class="statusbar"><span id="note"></span></div>
</div>

<div class="centro" id="centro">
  <h2 id="centro-t">Carregando projeto…</h2>
  <p id="centro-p"></p>
</div>

  <script src="assets/engine.js"></script>
  <script src="assets/yash/lexer.js"></script>
  <script src="assets/yash/parser.js"></script>
  <script src="assets/yash/vm.js"></script>
  <script src="assets/yash/index.js"></script>
  <script src="assets/yash/yash-engine-host.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/auth.js"></script>
<script>
(function () {
  var el = function (tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { var v = attrs[k]; if (v == null) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v); }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;

      function bandaOn(liga) { var ov = z.el.querySelector(".zona-alvo"); if (ov) { var bnd = ov.querySelector(".band"); if (bnd) bnd.classList.toggle("on", liga); ov.classList.toggle("on", liga); } }
      z.el.addEventListener("dragover", function (e) { if (!arrastando && !arrastoAba) return; if (dadosDeTransfer(e)) return; e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (_) {} z.el.classList.add("dropalvo"); bandaOn(true); });
      z.el.addEventListener("dragleave", function (e) { if (z.el.contains(e.relatedTarget)) return; z.el.classList.remove("dropalvo"); bandaOn(false); });
      z.el.addEventListener("drop", function (e) { if (dadosDeTransfer(e)) return; e.preventDefault(); z.el.classList.remove("dropalvo"); bandaOn(false); var pid = arrastando || arrastoAba; if (pid) moverPainel(pid, z.id); arrastando = null; arrastoAba = null; });
    });
    Object.keys(zonas).forEach(function (k) { if (zonas[k].paineis.length) zonas[k].ativo = zonas[k].paineis[0]; });
    renderTodas();
  }

  function definirModo(m) {
    modo = m; parar();
    modoLabelEl.textContent = m === "js" ? "JavaScript" : "YashScript";
    noteEl.innerHTML = m === "js"
      ? "Modo <b>JavaScript</b>: a lógica usa a API <code>ys.*</code> do motor direto (para quem quer controle fino)."
      : "Modo <b>YashScript</b>: interpretado pelo motor nativo do navegador, <b>sem Fengari, sem Luau e sem Roblox</b>.";
    noteEl.innerHTML += " O estúdio <b>abre parado</b>, com a cena em <b>contorno</b>: clique num nó para selecionar, <b>arraste</b> para mover, use as <b>alças</b> para redimensionar, <b>setas</b> ajustam (segure <b>Shift</b> para saltar de 40 em 40) e <b>Delete</b> remove. <b>▶ Rodar</b> testa o jogo — dá para selecionar e arrastar <b>durante a execução</b> (o contorno fica verde; essas mudanças são só do teste, a cena autorada não muda). <b>⏹ Parar</b> volta para a edição.";
    mostrarErro(""); limparLog();
    renderArvore(); preview();
  }

  var MENUS = [
    { rot: "Cena", itens: [
      { rot: "Adicionar nó…", atalho: "botão direito", fn: function () { dialogoNo(function (t) { adicionarNo(t, null); }); } },
      { rot: "Renomear nó", fn: function () { renomearSelecionado(selectedId); } },
      { rot: "Duplicar nó", fn: function () { duplicarNoSelecionado(); } },
      { rot: "Remover nó", atalho: "Delete", fn: function () { removerNoSelecionado(); } },
      { sep: true },
      { rot: "Nova cena…", fn: function () { dialogoTexto("Nova cena", "O nome da cena que vai entrar neste projeto.", "", function (v) { novaCena(v); }); } },
      { rot: "Exportar cena atual (.json)", fn: function () { exportarCena(); } }
    ] },
    { rot: "Projeto", itens: [
      { rot: "Salvar", atalho: "Ctrl+S", fn: function () { salvar(); } },
      { sep: true },
      { rot: "Importar arquivos do PC…", fn: function () { escolherArquivos(); } },
      { sep: true },
      { rot: "Voltar aos projetos", fn: function () { location.href = "playground.html"; } },
      { rot: "Sair da conta", fn: function () { YashAuth.sair(); } }
    ] },
    { rot: "Depurar", itens: [
      { rot: "Rodar o projeto", atalho: "F5", fn: function () { rodar(); } },
      { rot: "Pausar / Continuar", fn: function () { pausarAcao(); } },
      { rot: "Restaurar", fn: function () { restaurarAcao(); } },
      { rot: "Parar", fn: function () { pararExecucao(); } }
    ] },
    { rot: "Editor", itens: [
      { rot: "Redefinir layout dos painéis", fn: function () { redefinirLayout(); } },
      { sep: true },
      { rot: "Modo: YashScript", fn: function () { definirModo("yashnativo"); } },
      { rot: "Modo: JavaScript (API do motor)", fn: function () { definirModo("js"); } }
    ] },
    { rot: "Exibir", itens: [
      { rot: "Workspace 2D", fn: function () { modoWorkspace("2d"); } },
      { rot: "Workspace 3D", fn: function () { modoWorkspace("3d"); } },
      { rot: "Workspace Script", fn: function () { modoWorkspace("script"); } },
      { sep: true },
      { rot: "Dock: Cena (árvore)", fn: function () { reabrirPainel("arvorecenas"); } },
      { rot: "Dock: Sistema de Arquivos", fn: function () { reabrirPainel("arquivos"); } },
      { rot: "Dock: Visual", fn: function () { reabrirPainel("cena"); } },
      { rot: "Dock: Script", fn: function () { reabrirPainel("script"); } },
      { rot: "Dock: Inspetor", fn: function () { reabrirPainel("inspetor"); } },
      { rot: "Dock: Saída", fn: function () { reabrirPainel("saida"); } }
    ] },
    { rot: "Ajuda", itens: [
      { rot: "Sobre o YashStudio", fn: function () { mostrarSobre(); } }
    ] }
  ];

  function fecharMenus() {
    Array.prototype.forEach.call(menusEl.children, function (w) { w.classList.remove("open"); var p = w.querySelector(".menu-pop"); if (p) p.hidden = true; });
  }
  function construirMenus() {
    menusEl.innerHTML = "";
    MENUS.forEach(function (m) {
      var wrap = el("div", { class: "menu" });
      var btn = el("button", { type: "button", text: m.rot });
      var pop = el("div", { class: "menu-pop" }); pop.hidden = true;
      m.itens.forEach(function (it) {
        if (it.sep) { pop.appendChild(el("div", { class: "sep" })); return; }
        var b = el("button", { type: "button" }, [el("span", { text: it.rot })]);
        if (it.atalho) b.appendChild(el("span", { class: "mi-atalho", text: it.atalho }));
        b.onclick = function (e) { e.stopPropagation(); fecharMenus(); it.fn(); };
        pop.appendChild(b);
      });
      btn.onclick = function (e) { e.stopPropagation(); var abrir = pop.hidden; fecharMenus(); if (abrir) { pop.hidden = false; wrap.classList.add("open"); } };
      wrap.appendChild(btn); wrap.appendChild(pop); menusEl.appendChild(wrap);
    });
  }

  function mostrarSobre() {
    var o = el("div", { class: "about-bg" });
    var c = el("div", { class: "about-card" }, [
      el("h3", { text: "YashStudio 2D" }),
      el("p", { text: "Mini studio no navegador. A disposição dos painéis segue o estilo do Godot: as abas podem ser arrastadas entre os painéis e você escolhe onde cada uma fica. O visual segue o tema do site YashScript. O YashScript é executado pelo interpretador nativo do navegador — sem Fengari, sem Luau e sem Roblox; a geração de Luau continua existindo só no porte do plugin Roblox." }),
      el("p", { text: "A cena é guardada junto com o código na sua conta: dê ⏹ Parar para ver e editar os nós (posição, tamanho, cor, gravidade…), use “+ nó” para criar novos e escreva o script em YashScript. Um criar do script com o mesmo nome de um nó da cena reusa aquele nó — a execução nunca muda a cena autorada." }),
      el("button", { class: "tbtn", type: "button", text: "Fechar", onclick: function () { o.remove(); } })
    ]);
    o.appendChild(c);
    o.addEventListener("click", function (e) { if (e.target === o) o.remove(); });
    document.body.appendChild(o);
  }

  document.getElementById("rodar").addEventListener("click", rodar);
  document.getElementById("salvar").addEventListener("click", salvar);
  document.getElementById("pausar").addEventListener("click", pausarAcao);
  document.getElementById("restaurar").addEventListener("click", restaurarAcao);
  document.getElementById("parar").addEventListener("click", pararExecucao);
  if (ws2d) ws2d.addEventListener("click", function () { modoWorkspace("2d"); });
  if (ws3d) ws3d.addEventListener("click", function () { modoWorkspace("3d"); });
  if (wsScript) wsScript.addEventListener("click", function () { modoWorkspace("script"); });
  marcarWs();

  // botão direito em toda a tela abre o menu da engine, nunca o do Chrome
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return; // campos de edição mantêm o menu do navegador
    e.preventDefault();
  });
  document.addEventListener("click", function () { fecharCtx(); });
  window.addEventListener("blur", function () { fecharCtx(); });
  // botão direito na viewport (canvas) cria/edita nós na posição do clique
  canvas.addEventListener("contextmenu", function (e) {
    e.preventDefault(); e.stopPropagation();
    var p = coordsDoEvento(e), atingido = noSob(p.x, p.y);
    if (atingido && atingido.id !== selectedId) selecionar(atingido.id);
    noContexto(atingido || null, { clientX: e.clientX, clientY: e.clientY });
    ctxUltimaPos = { x: p.x, y: p.y };
  });
  var ctxUltimaPos = null;

  // soltar arquivos do PC em qualquer ponto do estúdio
  var dragDentro = 0;
  window.addEventListener("dragenter", function (e) { if (!dadosDeTransfer(e)) return; e.preventDefault(); dragDentro++; mostrarDropArquivos(true); });
  window.addEventListener("dragover", function (e) { if (!dadosDeTransfer(e)) return; e.preventDefault(); try { e.dataTransfer.dropEffect = "copy"; } catch (_) {} });
  window.addEventListener("dragleave", function (e) { if (!dadosDeTransfer(e)) return; dragDentro = Math.max(0, dragDentro - 1); if (!dragDentro) mostrarDropArquivos(false); });
  window.addEventListener("drop", function (e) {
    if (!dadosDeTransfer(e)) return;
    e.preventDefault(); dragDentro = 0; mostrarDropArquivos(false);
    var f = filesDe(e); if (f && f.length) importarArquivos(f, null);
  });

  codeEl.addEventListener("input", function () {
    scripts[0].conteudo = codeEl.value;
    marcarDirty();
  });
  pnomeEl.addEventListener("change", function () {
    projetoNome = pnomeEl.value.trim() || "Projeto";
    pnomeEl.value = projetoNome;
    marcarDirty();
  });

  function coordsDoEvento(e) {
    var r = canvas.getBoundingClientRect();
    // sem layout (canvas oculto ou headless) não há como escalar: trata o pixel de tela como pixel do mundo
    if (!r.width || !r.height) return { x: e.clientX, y: e.clientY };
    var escala = Math.min(r.width / canvas.width, r.height / canvas.height);
    var w = canvas.width * escala, h = canvas.height * escala;
    var ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
    return { x: (e.clientX - ox) / escala, y: (e.clientY - oy) / escala };
  }

  function podeEditar() { return !!engine && !!projetoId; }

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || !podeEditar()) return;
    var p = coordsDoEvento(e), no = objSelecionado();
    var alca = no ? alcaSob(no, p.x, p.y) : null;
    if (!alca) {
      var atingido = noSob(p.x, p.y);
      if (atingido) { if (atingido.id !== selectedId) selecionar(atingido.id); arrasto = { no: atingido, modo: "mover", px: p.x, py: p.y, x0: atingido.x, y0: atingido.y, w0: atingido.w, h0: atingido.h, mudou: false }; }
      else { arrasto = null; selecionar(null); }
      e.preventDefault();
      return;
    }
    arrasto = { no: no, modo: "redim", alca: alca, px: p.x, py: p.y, x0: no.x, y0: no.y, w0: no.w, h0: no.h, mudou: false };
    e.preventDefault();
  });

  window.addEventListener("mousemove", function (e) {
    if (!arrasto || !podeEditar()) return;
    var p = coordsDoEvento(e), no = arrasto.no;
    var dx = p.x - arrasto.px, dy = p.y - arrasto.py;
    var passo = e.shiftKey ? GRADE : 1;
    function arred(v) { return Math.round(v / passo) * passo; }
    if (arrasto.modo === "mover") {
      no.x = arred(arrasto.x0 + dx / zoomAtual());
      no.y = arred(arrasto.y0 + dy / zoomAtual());
    } else {
      var a = LADOS[arrasto.alca] || {}, z = zoomAtual();
      var esq = arrasto.x0, topo = arrasto.y0, larg = arrasto.w0, alt = arrasto.h0;
      if (a.e) larg = arrasto.w0 + dx / z;
      if (a.o) { larg = arrasto.w0 - dx / z; esq = arrasto.x0 + dx / z; }
      if (a.s) alt = arrasto.h0 + dy / z;
      if (a.n) { alt = arrasto.h0 - dy / z; topo = arrasto.y0 + dy / z; }
      larg = Math.max(passo, arred(larg)); alt = Math.max(passo, arred(alt));
      if (a.o) esq = arrasto.x0 + arrasto.w0 - larg;
      if (a.n) topo = arrasto.y0 + arrasto.h0 - alt;
      no.x = arred(esq); no.y = arred(topo); no.w = larg; no.h = alt;
    }
    arrasto.mudou = true;
    preview(); renderInspector(false);
  });

  window.addEventListener("mouseup", function () {
    if (!arrasto) return;
    var mudou = arrasto.mudou;
    arrasto = null;
    if (!mudou || emExecucao) return;
    marcarDirty();
    setStatus("cena ajustada");
  });

  canvas.addEventListener("mousemove", function (e) {
    var p = coordsDoEvento(e);
    mouseX = p.x; mouseY = p.y;
    if (!podeEditar() || arrasto) return;
    var no = objSelecionado();
    var alca = no ? alcaSob(no, p.x, p.y) : null;
    canvas.style.cursor = alca ? (CURSORES[alca] || "move") : (noSob(p.x, p.y) ? "move" : "default");
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "F5") { e.preventDefault(); rodar(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); salvar(); return; }
    if (!podeEditar()) return;
    var alvo = e.target;
    if (alvo && alvo.tagName && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT")) return;
    var no = objSelecionado();
    if (!no) return;
    if (!emExecucao && (e.key === "Delete" || e.key === "Backspace")) { e.preventDefault(); removerNoSelecionado(); return; }
    var passo = e.shiftKey ? GRADE : 1, mexeu = false;
    if (e.key === "ArrowLeft") { no.x -= passo; mexeu = true; }
    else if (e.key === "ArrowRight") { no.x += passo; mexeu = true; }
    else if (e.key === "ArrowUp") { no.y -= passo; mexeu = true; }
    else if (e.key === "ArrowDown") { no.y += passo; mexeu = true; }
    if (!mexeu) return;
    e.preventDefault();
    if (emExecucao) { renderInspector(false); return; }
    marcarDirty(); preview(); renderInspector(false);
  });

  setInterval(function () { if (dirty) salvar(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (document.hidden && dirty) salvar(); });
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  function erroView(msg) {
    centro.hidden = false; principal.hidden = true;
    document.getElementById("centro-t").textContent = "Não foi possível abrir o projeto";
    document.getElementById("centro-p").innerHTML = "";
    document.getElementById("centro-p").appendChild(el("span", { text: msg }));
    document.getElementById("centro-p").appendChild(document.createElement("br"));
    document.getElementById("centro-p").appendChild(el("a", { href: "playground.html", text: "Voltar aos meus projetos" }));
  }

  function boot() {
    projetoId = new URLSearchParams(location.search).get("id");
    if (!projetoId) return erroView("Projeto não especificado na URL.");
    YashAuth.carregarProjeto(projetoId).then(function (p) {
      if (!p) return erroView("Projeto não encontrado, ou ele não pertence à sua conta.");
      projetoNome = p.nome || "Projeto";
      pnomeEl.value = projetoNome;
      projetoDim = (p.dim === "3d") ? "3d" : "2d";
      codeEl.value = (p.codigo && p.codigo.trim()) ? p.codigo : CONTEUDO_PADRAO;
      scripts[0].conteudo = codeEl.value;
      cenas = cenasDe(p.cenas, projetoDim);
      if (!p.cenas && p.cena) { cenas = [cenaDe(p.cena, "Cena 1")]; } // compat: projeto antigo tinha uma só cena
      cenaAtivaId = (p.cenaAtiva && cenaPorId(p.cenaAtiva)) ? p.cenaAtiva : cenas[0].id;
      cena = cenaPorId(cenaAtivaId);
      assets = Array.isArray(p.assets) ? p.assets.filter(function (a) { return a && a.id; }) : [];
      selectedId = null;
      centro.hidden = true; principal.hidden = false;
      setStatus("salvo", "ok");
      definirModo("yashnativo");
      wsAtivo = projetoDim; marcarWs();
      renderCenas(); renderArquivos(); renderArvore(); preview();
    }, function (e) { erroView(e && e.message || String(e)); });
  }

  iniciarDocks();
  construirMenus();
  renderInspector(true);
  YashUI.chip(document.getElementById("ys-conta"), { aoProjetos: function () { location.href = "playground.html"; } });
  YashAuth.aoPronto(function (st) {
    if (!st.usuario) { centro.hidden = false; principal.hidden = true; YashUI.exigirLogin({ permitirPular: false }).then(boot); }
    else boot();
  });

  window.__yashDebug = function () {    var sel = objSelecionado();
    return { modo: modo, projeto: projetoId, dirty: dirty, emExecucao: emExecucao,
      nos: cena.objetos.length, cena: cenaParaSalvar(),
      selecionado: sel ? { id: sel.id, nome: sel.nome, x: sel.x, y: sel.y, w: sel.w, h: sel.h, daCena: !!noDaCena(sel.id) } : null,
      objs: engine ? engine.objs.filter(function (o) { return !o._dead; }).length : 0 };
  };
})();
</script>
</body>
